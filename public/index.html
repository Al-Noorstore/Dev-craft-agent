<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Dev Craft Agent</title>
<style>
  :root {
    --primary: #14a878;
    --primary-dark: #0f8f65;
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e6e8eb;
    --text: #111827;
    --text-muted: #6b7280;
    --text-faint: #9aa1ab;
    --pill-bg: #f0f1f3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); display: flex; overflow: hidden; color: var(--text); }
  svg { display: block; }

  /* ============ TOP MENU DROPDOWN ============ */
  #sidebar { position: fixed; top: 58px; left: 10px; width: 290px; max-height: 78vh; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 16px 40px rgba(17,24,39,0.14); display: flex; flex-direction: column; overflow: hidden; z-index: 60; opacity: 0; transform: translateY(-8px) scale(0.98); pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
  #sidebar.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--text); font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .menu-item:hover { background: var(--bg); }
  .menu-item .ic { width: 18px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
  #newChat { margin: 10px 12px; padding: 11px; border: none; border-radius: 12px; background: var(--primary); color: white; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  #newChat:hover { background: var(--primary-dark); }
  .side-label { padding: 10px 16px 6px; color: var(--text-faint); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  #convList { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .conv-item { display: flex; align-items: center; padding: 10px 10px; border-radius: 10px; color: var(--text-muted); font-size: 13px; cursor: pointer; margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
  .conv-item:hover { background: var(--bg); }
  .conv-item.active { background: #e8f6ef; color: var(--primary-dark); font-weight: 600; }
  .conv-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .conv-item .del { color: var(--text-faint); padding: 2px 6px; border-radius: 5px; visibility: hidden; }
  .conv-item:hover .del { visibility: visible; }
  .conv-item .del:hover { color: #ef4444; background: rgba(239,68,68,0.08); }

  /* ============ MAIN ============ */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; height: 100dvh; background: var(--bg); }
  #topbar { background: var(--card); padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 55; flex-shrink: 0; }
  .icon-btn { display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 7px; border-radius: 10px; width: 36px; height: 36px; flex-shrink: 0; }
  .icon-btn:hover, .icon-btn.active { background: var(--bg); }
  .topbar-logo { width: 28px; height: 28px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #topbar h1 { color: var(--text); font-size: 16px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 4px; }
  .topbar-title { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }

  #chat { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 4px; }

  .msg-row { display: flex; align-items: flex-start; gap: 8px; max-width: 84%; margin-bottom: 4px; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }
  .avatar { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg { padding: 11px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg-row.user .msg { background: var(--primary); color: white; border-bottom-right-radius: 5px; }
  .msg-row.bot .msg { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .msg.typing { color: var(--text-muted); font-style: italic; }
  .msg-actions { display: flex; gap: 6px; margin-top: 4px; padding: 0 2px; }
  .mini-btn { display: flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--border); color: var(--text-faint); font-size: 11px; padding: 4px 8px; border-radius: 8px; cursor: pointer; }
  .mini-btn:hover { color: var(--text-muted); border-color: #d1d5db; }
  .mini-btn.copied { color: var(--primary-dark); border-color: var(--primary); }

  .steps { margin: 4px 0 8px; padding: 10px 12px; border-radius: 12px; background: #e8f6ef; border: 1px solid #cdeee0; font-size: 12.5px; max-width: 84%; align-self: flex-start; }
  .steps-title { font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .step { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; color: var(--text-muted); }
  .step .ic { width: 16px; text-align: center; flex-shrink: 0; }
  .step.done .st { color: #0f8f65; }
  .step.error .st { color: #dc2626; }
  .step .st { font-weight: 600; flex-shrink: 0; }
  .step .dt { color: var(--text-faint); word-break: break-all; }
  .msg a { color: var(--primary-dark); text-decoration: underline; word-break: break-all; }

  .welcome { text-align: center; margin: auto; padding: 30px 20px; max-width: 460px; width: 100%; }
  .welcome-logo { width: 72px; height: 72px; background: var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .welcome h2 { color: var(--text); font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .welcome p { color: var(--text-muted); font-size: 13px; margin-bottom: 22px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick button { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 14px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; line-height: 1.35; }
  .quick button:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(20,168,120,0.12); }
  .quick .qic { font-size: 17px; }

  .input-area { padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .round-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--pill-bg); color: var(--text-muted); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .round-btn:hover { background: #e5e7eb; }
  #mic.listening { background: #fee2e2; color: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  #inputWrap { flex: 1; display: flex; align-items: center; background: var(--pill-bg); border-radius: 22px; padding: 2px 6px 2px 16px; }
  #input { flex: 1; background: transparent; border: none; color: var(--text); padding: 10px 4px; font-size: 14.5px; outline: none; resize: none; font-family: inherit; max-height: 120px; }
  #input::placeholder { color: var(--text-faint); }
  #send { width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--primary); color: white; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #send:hover { background: var(--primary-dark); }
  #send:disabled { opacity: 0.45; cursor: default; }

  /* ============ MOBILE ============ */
  #backdrop { display: none; position: fixed; inset: 0; background: transparent; z-index: 58; }
  #backdrop.show { display: block; }
  @media (max-width: 768px) {
    #sidebar { left: 8px; right: 8px; width: auto; }
    .msg-row { max-width: 90%; }
    #chat { padding: 12px; }
    .welcome h2 { font-size: 19px; }
  }
  @media (min-width: 769px) { .welcome { max-width: 480px; } }
</style>
</head>
<body>

  <!-- DROPDOWN MENU (hamburger se khulta hai) -->
  <aside id="sidebar">
    <div class="menu-item" onclick="goHome()"><span class="ic">🏠</span> Homepage</div>
    <button id="newChat" onclick="newChat()">＋ New Chat</button>
    <div class="menu-item" onclick="toggleVoice()">
      <span class="ic" id="voiceIcon">🔊</span> <span id="voiceLabel">Voice replies: On</span>
    </div>
    <div class="menu-item" onclick="clearCurrent()"><span class="ic">🗑</span> Clear this chat</div>
    <div class="side-label">CHAT HISTORY</div>
    <div id="convList"></div>
  </aside>
  <div id="backdrop" onclick="toggleSidebar(false)"></div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button id="hamburger" class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <div class="topbar-logo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        </div>
        <h1 id="chatTitle">Dev Craft Agent</h1>
      </div>
      <button class="icon-btn" onclick="newChat()" aria-label="New chat" title="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="chat"></div>

    <div class="input-area">
      <button class="round-btn" onclick="attachFile()" aria-label="Attach" title="Attach a file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="inputWrap">
        <textarea id="input" rows="1" placeholder="Message Dev Craft Agent..."></textarea>
      </div>
      <button id="mic" class="round-btn" onclick="toggleMic()" title="Bol kar poocho" aria-label="Voice input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 0 1-14 0M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="send" onclick="sendMsg()" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

<script>
  // ====== STATE ======
  let conversations = JSON.parse(localStorage.getItem('dc_conversations') || '[]');
  let currentId = localStorage.getItem('dc_current') || null;
  let voiceEnabled = true, listening = false, busy = false;

  const chat = document.getElementById('chat');
  const input = document.getElementById('input');

  const BOLT_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>';
  const COPY_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg>';
  const SPEAK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H2v6h4l5 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

  function save() {
    localStorage.setItem('dc_conversations', JSON.stringify(conversations));
    localStorage.setItem('dc_current', currentId || '');
  }
  function current() { return conversations.find(c => c.id === currentId); }

  // ====== RENDER ======
  function renderSidebar() {
    const list = document.getElementById('convList');
    list.innerHTML = '';
    [...conversations].sort((a, b) => b.updated - a.updated).forEach(c => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.id === currentId ? ' active' : '');
      div.innerHTML = `<span class="t">${c.title}</span><span class="del" onclick="event.stopPropagation();deleteConv('${c.id}')">✕</span>`;
      div.onclick = () => loadConv(c.id);
      list.appendChild(div);
    });
    if (!conversations.length) list.innerHTML = '<div style="color:var(--text-faint);font-size:12px;padding:10px">Abhi koi chat nahi — new chat shuru karo!</div>';
  }

  function renderChat() {
    const c = current();
    chat.innerHTML = '';
    // header title stays fixed as brand name; sidebar shows per-chat titles
    if (!c || !c.messages.length) {
      chat.innerHTML = `<div class="welcome">
        <div class="welcome-logo">${BOLT_SVG.replace('width="14" height="14"', 'width="30" height="30"')}</div>
        <h2>How can I help you today?</h2>
        <p>English • Urdu • Roman Urdu — likho ya bol kar poocho</p>
        <div class="quick">
          <button onclick="quick('Find me 5 restaurant leads in Tulsa')"><span class="qic">🔍</span> Find leads</button>
          <button onclick="quick('Draft an outreach email for a dental clinic')"><span class="qic">✍️</span> Draft an outreach email</button>
          <button onclick="quick('What should I charge for a 5-page business website?')"><span class="qic">💰</span> Pricing a website</button>
          <button onclick="quick('Write HTML code for a modern hero section')"><span class="qic">💻</span> Write code</button>
        </div>
      </div>`;
      return;
    }
    c.messages.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot', false));
    chat.scrollTop = chat.scrollHeight;
  }

  function linkify(text) {
    const d = document.createElement('div');
    const parts = text.split(/(https?:\/\/[^\s)]+)/g);
    for (const part of parts) {
      if (/^https?:\/\//.test(part)) {
        const a = document.createElement('a');
        a.href = part; a.textContent = part; a.target = '_blank'; a.rel = 'noopener';
        d.appendChild(a);
      } else {
        d.appendChild(document.createTextNode(part));
      }
    }
    return d;
  }

  function addSteps(steps) {
    if (!Array.isArray(steps) || !steps.length) return;
    const box = document.createElement('div');
    box.className = 'steps';
    const t = document.createElement('div');
    t.className = 'steps-title';
    t.textContent = '⚡ Agent kaam kar raha hai';
    box.appendChild(t);
    for (const s of steps) {
      const row = document.createElement('div');
      row.className = 'step ' + (s.status || 'done');
      const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = s.status === 'error' ? '❌' : (s.status === 'working' ? '⏳' : '✅');
      const st = document.createElement('span'); st.className = 'st'; st.textContent = s.title;
      row.appendChild(ic); row.appendChild(st);
      if (s.detail) { const dt = document.createElement('span'); dt.className = 'dt'; dt.textContent = '— ' + s.detail; row.appendChild(dt); }
      box.appendChild(row);
    }
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  function addMsg(text, who, saveMsg = true) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + who;

    if (who === 'bot') {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.innerHTML = BOLT_SVG;
      row.appendChild(av);
    }

    const col = document.createElement('div');
    col.className = 'msg-col';

    const bubble = document.createElement('div');
    bubble.className = 'msg';
    if (who === 'bot') bubble.appendChild(linkify(text));
    else bubble.textContent = text;
    col.appendChild(bubble);

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'mini-btn';
    copyBtn.innerHTML = COPY_SVG + '<span>Copy</span>';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = COPY_SVG + '<span>Copied</span>';
        setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = COPY_SVG + '<span>Copy</span>'; }, 1500);
      });
    };
    actions.appendChild(copyBtn);
    if (who === 'bot') {
      const speakBtn = document.createElement('button');
      speakBtn.className = 'mini-btn';
      speakBtn.innerHTML = SPEAK_SVG;
      speakBtn.onclick = () => speak(text);
      actions.appendChild(speakBtn);
    }
    col.appendChild(actions);

    row.appendChild(col);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;

    if (saveMsg && currentId) {
      const c = current();
      c.messages.push({ role: who === 'user' ? 'user' : 'assistant', content: text });
      c.updated = Date.now();
      save();
    }
    if (who === 'bot' && voiceEnabled) speak(text);
  }

  // ====== CHAT ACTIONS ======
  function newChat() {
    const conv = { id: 'c' + Date.now(), title: 'New Chat', messages: [], updated: Date.now() };
    conversations.push(conv);
    currentId = conv.id;
    save(); renderSidebar(); renderChat();
    toggleSidebar(false);
    input.focus();
  }

  function loadConv(id) {
    currentId = id; save(); renderSidebar(); renderChat();
    toggleSidebar(false);
  }

  function goHome() {
    currentId = null;
    save(); renderSidebar(); renderChat();
    document.getElementById('chatTitle').textContent = 'Dev Craft Agent';
    toggleSidebar(false);
  }

  function deleteConv(id) {
    conversations = conversations.filter(c => c.id !== id);
    if (currentId === id) currentId = conversations.length ? conversations[0].id : null;
    save(); renderSidebar(); renderChat();
  }

  function clearCurrent() { if (current()) { current().messages = []; current().title = 'New Chat'; save(); renderSidebar(); renderChat(); } toggleSidebar(false); }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text || busy) return;
    if (!current()) newChat();
    input.value = '';
    input.style.height = 'auto';
    addMsg(text, 'user');
    const c = current();
    if (c.title === 'New Chat') { c.title = text.slice(0, 32) + (text.length > 32 ? '...' : ''); renderSidebar(); }

    busy = true;
    const typingRow = document.createElement('div');
    typingRow.className = 'msg-row bot';
    typingRow.innerHTML = `<div class="avatar">${BOLT_SVG}</div><div class="msg-col"><div class="msg typing">...kaam kar raha hoon</div></div>`;
    chat.appendChild(typingRow);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: c.messages.slice(-10) })
      });
      const data = await res.json();
      typingRow.remove();
      addSteps(data.steps);
      const reply = data.reply || data.error || 'Error — deployment/keys check karo';
      c.messages.push({ role: 'assistant', content: reply });
      c.updated = Date.now(); save();
      addMsg(reply, 'bot', false);
    } catch (e) {
      typingRow.remove();
      addMsg('Connection error — Vercel deploy ho? OPENAI_API_KEY set hai?', 'bot');
    }
    busy = false;
  }

  // ====== VOICE ======
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    const short = text.length > 300 ? text.slice(0, 300) + '...' : text;
    const u = new SpeechSynthesisUtterance(short);
    u.lang = /(hai|kar|nahi|kya)/i.test(text) ? 'hi-IN' : 'en-US';
    u.rate = 1;
    speechSynthesis.speak(u);
  }
  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    document.getElementById('voiceIcon').textContent = voiceEnabled ? '🔊' : '🔇';
    document.getElementById('voiceLabel').textContent = voiceEnabled ? 'Voice replies: On' : 'Voice replies: Off';
    if (!voiceEnabled) speechSynthesis.cancel();
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  if (SR) {
    recognition = new SR();
    recognition.lang = 'en-US'; recognition.interimResults = false;
    recognition.onresult = e => { input.value = e.results[0][0].transcript; sendMsg(); };
    recognition.onend = () => { listening = false; document.getElementById('mic').classList.remove('listening'); };
  }
  function toggleMic() {
    if (!recognition) return;
    if (listening) { recognition.stop(); return; }
    listening = true;
    document.getElementById('mic').classList.add('listening');
    recognition.start();
  }

  // ====== ATTACH (placeholder) ======
  function attachFile() {
    const el = document.createElement('input');
    el.type = 'file';
    el.onchange = () => {
      if (el.files[0]) input.value = (input.value ? input.value + ' ' : '') + `[Attached: ${el.files[0].name}]`;
      input.focus();
    };
    el.click();
  }

  // ====== TOP MENU DROPDOWN ======
  function toggleSidebar(force) {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('backdrop');
    const hb = document.getElementById('hamburger');
    const open = force !== undefined ? force : !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    bd.classList.toggle('show', open);
    hb.classList.toggle('active', open);
  }

  // ====== INPUT auto-resize ======
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) { e.preventDefault(); sendMsg(); }
  });

  function quick(t) { input.value = t; sendMsg(); }

  // ====== INIT ======
  if (!conversations.length) newChat();
  else { if (!current()) currentId = conversations[0].id; renderSidebar(); renderChat(); }
</script>
</body>
</html>
